name: Update Shows

on:
  schedule:
    - cron: '0 7 * * *'   # runs daily at 07:00 UTC
  workflow_dispatch:        # allows manual trigger from GitHub Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape and update shows
        run: python scripts/update_shows.py

      - name: Commit if changed
        run: |
          git config user.name "shows-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet && echo "Nothing to commit." || (
            git add index.html &&
            git commit -m "chore: update upcoming shows" &&
            git push
          )
